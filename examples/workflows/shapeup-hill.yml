name: shapeup-hill

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:
    inputs:
      pitch_number:
        description: Pitch number (leave empty to redraw every open pitch that has scopes)
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  hill:
    # Anything that is not a person's comment on a scope, or a scope opening or closing, never starts a runner.
    # Keep the label name in step with scopeLabel in the config.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'scope')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' && contains(github.event.issue.labels.*.name, 'scope'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every pitch commits to one generated branch, so runs go one at a time across the repository.
    # Only the latest pending run is kept; each run aligns every open pitch, so a cancelled one loses nothing.
    concurrency:
      group: shapeup-hill-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/shapeup.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: vulpes-facility/gh-shapeup@v1
        with:
          project-token: ${{ secrets.SHAPEUP_PROJECT_TOKEN }}
